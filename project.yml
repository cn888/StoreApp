name: StoreApp

options:
  bundleIdPrefix: com.cn888
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  StoreApp:
    type: application
    platform: iOS
    sources:
      - path: StoreApp
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: StoreApp/Info.plist
      properties:
        CFBundleDisplayName: 应用市场
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 不锁定外观：跟随系统浅色/深色
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # canOpenURL 探测已安装的 App（这里没列的 scheme 探测会恒为 false）
        LSApplicationQueriesSchemes:
          - voicerecite
          - jxsaver
          - store
